# Model catalog and price table used by the router.
#
# provider        which adapter serves the model: "mock", "ollama", "openai" or "anthropic"
# tier            1 = small and cheap, 2 = mid-range, 3 = premium
# input_price     USD per 1M prompt tokens
# output_price    USD per 1M completion tokens
# context_window  max prompt + completion tokens the model accepts
# capabilities    extra features a request can require, e.g. "json" for JSON mode
#
# Models whose provider is switched off are ignored at startup.

# Mock models mirror typical commercial price points, so routing decisions and cost
# savings are realistic in demos without calling a paid API.
[[models]]
id = "mock-small"
provider = "mock"
tier = 1
input_price = 0.15
output_price = 0.60
context_window = 16000
capabilities = []

[[models]]
id = "mock-medium"
provider = "mock"
tier = 2
input_price = 1.00
output_price = 4.00
context_window = 128000
capabilities = ["json"]

[[models]]
id = "mock-large"
provider = "mock"
tier = 3
input_price = 5.00
output_price = 15.00
context_window = 200000
capabilities = ["json"]

# Local models cost nothing per token. context_window is kept at Ollama's conservative
# default; raise it together with OLLAMA_CONTEXT_LENGTH on the Ollama server.
[[models]]
id = "gemma4:e4b"
provider = "ollama"
tier = 1
input_price = 0
output_price = 0
context_window = 8192
capabilities = ["json"]

[[models]]
id = "gemma4:12b"
provider = "ollama"
tier = 2
input_price = 0
output_price = 0
context_window = 8192
capabilities = ["json"]

# Cloud models: list prices checked on 2026-10-01. Update them when providers change theirs;
# the usage ledger is only as accurate as this table.
#
# Anthropic models are added the same way, with provider = "anthropic" and the model id from
# Anthropic's model list. Leave out the json capability: Anthropic's structured outputs need a
# full schema, so it has no equivalent of OpenAI's "any JSON object" mode.
[[models]]
id = "gpt-6-luna"
provider = "openai"
tier = 1
input_price = 0.10
output_price = 0.50
context_window = 1050000
capabilities = ["json"]

[[models]]
id = "gpt-6.1-sol"
provider = "openai"
tier = 2
input_price = 2.00
output_price = 10.00
context_window = 1050000
capabilities = ["json"]

[[models]]
id = "gpt-6-astra"
provider = "openai"
tier = 3
input_price = 10.00
output_price = 50.00
context_window = 1050000
capabilities = ["json"]
